const catSheet=new Image(); catSheet.src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFwAAAASCAYAAADWvblEAAABlUlEQVR4nO2YP0vDQADFXySDVFAXwSwpJaWUbjrVTWcXcXbxk3Wp4FTwy4RQjJIMSUAKKiS41aHcQZK745LekUTzppBLfu/d/0sMNCzbmWyL90J/bTSRpYrq5paqGAte1YjHfHi8L5UtF6u92EUPnprILTQUwVlGPBNWxQnz9T0uPT8eWdJskV8bcxuiUSCCs4yWi1XOQFRxwgzeIgwGR7mys/MTaXbXchu2M9nyRoIIzjIaj6ycAWGzKv6RfHF5Vdhdy00N5tdXleBZljJ7mBXemc6kOVmWAoA0u2u5zTohCbwo2d6vIx67a7kPZF6Kw0DqHrCbxlX039gmQHdSugk50xl8z6XX+6hn52UCu/XKsod0+vmei4v5JZJoA99zqQGZknEYwLKHuXWLtTb27DJb2Rcd2WSOTw/x8vSs9EvxL7Gl1vBe6qS0wbMsxffnj0qkdnborw3fc5FEG9zc3gl/BahgK2twyx4C4B+92srWzS+ylTU42Rx4R6O2snXzi2xlDU56UMevVZ1s3Xzd2Xv1apd+AVmC5fHo/jZnAAAAAElFTkSuQmCC"; const CW=23,CH=18,CATX=164,CATY=87;
const room=document.getElementById("room"),g=document.getElementById("fx").getContext("2d"),term=document.getElementById("term"),out=document.getElementById("out");
const MON={main:{x:255,y:80,w:31,h:20,url:"http://127.0.0.1:8787/"},side:{x:291,y:79,w:18,h:27,url:"http://127.0.0.1:8787/napping/"}};
const CX=144,CY=108;                         // the cat's frame: its rack's feet stand on the floor line at y 146
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let t0=performance.now(),k=0,zoomed=false;
function frame(){k++;g.clearRect(0,0,320,180);const sec=still?0:(performance.now()-t0)/1000;
  // the cat on its tower: breathing on a slow cycle, a tail flick now and then
  const breathing=!still&&(sec%2.4)>1.2, flick=!still&&(sec%6.5)<0.3;
  const f=(flick?2:0)+(breathing?1:0);
  if(catSheet.complete)g.drawImage(catSheet,f*CW,0,CW,CH,CATX,CATY,CW,CH);
  // zZz drifting up from its head
  if(!still){for(let j=0;j<3;j++){const ph=((k/10)+j*1.4)%4.2,zx=CATX-2-Math.floor(ph*1.5),zy=CATY+2-Math.floor(ph*3.2),c=ph>3.2?"#414b50":"#56635f";g.fillStyle=c;g.fillRect(zx,zy,3,1);g.fillRect(zx+1,zy+1,1,1);g.fillRect(zx,zy+2,3,1)}}
  // the shell waits on the main monitor, a slow pulse round the screen until it is clicked
  const m=MON.main;g.fillStyle="#1e2326";g.fillRect(m.x+1,m.y+1,m.w-2,m.h-2);
  [["#83c092",14],["#9da9a0",22],["#dbbc7f",9],["#7fbbb3",17]].forEach(([c,w],j)=>{g.fillStyle=c;g.fillRect(m.x+2,m.y+2+j*2,w,1)});
  g.fillStyle="#9da9a0";g.fillRect(m.x+2,m.y+11,4,1);if(k%8<4){g.fillStyle="#83c092";g.fillRect(m.x+7,m.y+11,2,1)}
  if(!zoomed&&!still&&Math.floor(k/6)%2){g.fillStyle="rgba(131,192,146,.55)";g.fillRect(m.x-1,m.y-1,m.w+2,1);g.fillRect(m.x-1,m.y+m.h,m.w+2,1);g.fillRect(m.x-1,m.y,1,m.h);g.fillRect(m.x+m.w,m.y,1,m.h)}
  // LEDs on both towers
  if(!still)[[197,100],[197,104],[197,108],[206,100],[206,104],[206,112]].forEach(([x,y],j)=>{[0,-28].forEach((dx,t)=>{if((k+j*5+t*7)%11<3){g.fillStyle="#1e2326";g.fillRect(x+dx,y,1,1)}})});
}
setInterval(frame,110);
function zoomTo(which){if(zoomed)return;zoomed=true;document.getElementById("hint").style.display="none";
 const m=MON[which],R=room.getBoundingClientRect(),px=R.width/320;
 const s=Math.max(innerWidth/(m.w*px),innerHeight/(m.h*px))*1.02,cx=(m.x+m.w/2)*px,cy=(m.y+m.h/2)*px;
 room.classList.toggle("zoom",!still);
 room.style.transform="translate("+(innerWidth/2-R.left-cx*s)+"px,"+(innerHeight/2-R.top-cy*s)+"px) scale("+s+")";
 term.src=m.url;setTimeout(()=>{term.classList.add("on");out.style.display="block";term.focus()},still?0:820)}
function zoomOut(){zoomed=false;term.classList.remove("on");out.style.display="none";room.style.transform="none";document.getElementById("hint").style.display=""}
addEventListener("keydown",(e)=>{if(e.key==="Escape"&&zoomed)zoomOut();else if(e.key==="Enter"&&!zoomed)zoomTo("main")});
document.getElementById("hitMain").onclick=()=>zoomTo("main");document.getElementById("hitSide").onclick=()=>zoomTo("side");out.onclick=zoomOut;
</script>
